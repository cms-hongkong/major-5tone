<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音階辨識偵探 - 專業教學版</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --bg-gradient: linear-gradient(135deg, #1e3c72, #2a5298);
            --card-bg: rgba(255, 255, 255, 0.98);
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2d3436;
        }

        .container {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 2rem;
            width: 95%;
            max-width: 650px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* 偵探手冊提示框 */
        .reference-box {
            background: #f1f2f6;
            border-left: 8px solid #341f97;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            display: inline-block;
            width: 90%;
        }

        .ref-item {
            font-size: 1.1rem;
            margin: 5px 0;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .ref-label {
            display: inline-block;
            width: 100px;
            padding: 2px 8px;
            border-radius: 5px;
            margin-right: 10px;
            color: white;
            font-size: 0.9rem;
            text-align: center;
        }

        .label-major { background-color: #ff9f43; }
        .label-penta { background-color: #1dd1a1; }

        .difficulty-status {
            font-weight: bold;
            color: #576574;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .stat-value { display: block; font-size: 1.1rem; font-weight: 800; color: #341f97; }
        .stat-label { font-size: 0.7rem; color: #95a5a6; }

        #display-area {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 40px 10px;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 2px dashed #dfe6e9;
        }

        .note-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            animation: pop 0.3s ease-out forwards;
        }

        @keyframes pop {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .controls-wrapper {
            min-height: 60px;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-group { display: flex; gap: 15px; justify-content: center; }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-major { background: #ff9f43; color: white; }
        .btn-pentatonic { background: #1dd1a1; color: white; }
        .btn-next { background: #54a0ff; color: white; }
        .btn-restart { background: #ee5253; color: white; margin-top: 20px; }

        button:hover { transform: translateY(-2px); opacity: 0.9; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        #message { font-size: 1.3rem; font-weight: bold; margin: 15px 0; height: 1.5rem; }
        .hidden { display: none !important; }
        .highlight-hint { color: #d63031; font-weight: 900; }
    </style>
</head>
<body>

<div class="container">
    <!-- 首頁畫面 (確保使用者互動後才能啟動聲音) -->
    <div id="start-screen">
        <h1>🎵 音階辨識偵探</h1>
        <p style="font-size: 1.2rem; color: #576574; margin-bottom: 30px;">準備好你的耳朵，來挑戰大調與五聲音階的差別吧！</p>
        <button class="btn-next" onclick="startGame()">▶ 開始測驗</button>
    </div>

    <!-- 遊戲主畫面 -->
    <div id="play-screen" class="hidden">
        <h1>音階辨識偵探</h1>

        <div class="reference-box">
            <div class="difficulty-status" id="mode-text">模式：入門測試</div>
            <div class="ref-item">
                <span class="ref-label label-major">大調音階</span> 
                d r m <span class="highlight-hint">f</span> s l <span class="highlight-hint">t</span> d'
            </div>
            <div class="ref-item">
                <span class="ref-label label-penta">五聲音階</span> 
                d r m s l d'
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-label">關卡</span><span class="stat-value" id="level">1</span></div>
            <div class="stat-card"><span class="stat-label">分數</span><span class="stat-value" id="score">0</span></div>
            <div class="stat-card"><span class="stat-label">連擊</span><span class="stat-value" id="combo">0</span></div>
            <div class="stat-card"><span class="stat-label">正確</span><span class="stat-value" id="correct">0</span></div>
        </div>

        <div id="display-area"></div>
        <div id="message"></div>

        <!-- 按鈕區使用外掛 wrapper 避免跳動 -->
        <div class="controls-wrapper">
            <div class="btn-group" id="action-buttons">
                <button class="btn-major" onclick="checkAnswer('major')">大調音階</button>
                <button class="btn-pentatonic" onclick="checkAnswer('pentatonic')">五聲音階</button>
            </div>
            <div class="btn-group hidden" id="next-btn-container">
                <button class="btn-next" id="next-btn" onclick="nextQuestion()">下一題 ➔</button>
            </div>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="game-over" class="hidden">
        <h2 style="font-size: 2.5rem; color: #341f97;">測驗結束！</h2>
        <p>最終得分：<span id="final-score" style="font-size: 2rem; font-weight: 900; color: #ff6b6b;">0</span></p>
        <button class="btn-restart" onclick="resetGame()">再挑戰一次</button>
    </div>
</div>

<script>
    // 包含顏色與音高頻率 (C4 - C5)
    const notesInfo = {
        'd': { color: '#eb4d4b', freq: 261.63 },
        'r': { color: '#f0932b', freq: 293.66 },
        'm': { color: '#f1c40f', freq: 329.63 },
        'f': { color: '#badc58', freq: 349.23 },
        's': { color: '#7ed6df', freq: 392.00 },
        'l': { color: '#e056fd', freq: 440.00 },
        't': { color: '#686de0', freq: 493.88 },
        "d'": { color: '#ff7979', freq: 523.25 }
    };

    const majorFull = ['d', 'r', 'm', 'f', 's', 'l', 't', "d'"];
    const pentatonicFull = ['d', 'r', 'm', 's', 'l', "d'"];

    let state = { level: 0, score: 0, combo: 0, correctCount: 0, currentAnswer: '', isAnswered: false };
    let renderTimers = []; // 用來清除快速點擊時殘留的定時器
    let audioCtx = null;   // 音效 API

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    // 播放音符聲音
    function playTone(frequency) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        // 讓聲音有自然的淡出效果
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.6);
        oscillator.stop(audioCtx.currentTime + 0.6);
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('play-screen').classList.remove('hidden');
        
        // 啟動瀏覽器 AudioContext (必須在使用者點擊按鈕時觸發)
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        
        nextQuestion();
    }

    function nextQuestion() {
        state.level++;
        if (state.level > 10) { showGameOver(); return; }

        state.isAnswered = false;
        document.getElementById('level').innerText = state.level;
        document.getElementById('message').innerText = '';
        
        // UI 切換
        document.getElementById('next-btn-container').classList.add('hidden');
        document.getElementById('action-buttons').classList.remove('hidden');

        const modeText = document.getElementById('mode-text');
        state.currentAnswer = Math.random() > 0.5 ? 'major' : 'pentatonic';
        let displayNotes = [];

        if (state.level <= 2) {
            modeText.innerText = "模式：入門 (完整音階順序)";
            displayNotes = state.currentAnswer === 'major' ? [...majorFull] : [...pentatonicFull];
        } else {
            modeText.innerText = "模式：偵探 (隨機抽取音符)";
            const count = Math.random() > 0.5 ? 4 : 5; // 隨機抽 4 或 5 個音
            if (state.currentAnswer === 'pentatonic') {
                displayNotes = shuffle([...pentatonicFull]).slice(0, count);
            } else {
                let mustHave = shuffle(['f', 't'])[0]; // 大調必含 f 或 t
                let others = majorFull.filter(n => n !== mustHave);
                displayNotes = shuffle([mustHave, ...shuffle(others).slice(0, count - 1)]);
            }
        }
        renderNotes(displayNotes);
    }

    function renderNotes(notes) {
        const area = document.getElementById('display-area');
        area.innerHTML = '';
        
        // 預防玩家瘋狂點擊下一題：清除先前的定時器
        renderTimers.forEach(timer => clearTimeout(timer));
        renderTimers = [];

        notes.forEach((note, i) => {
            let timer = setTimeout(() => {
                const div = document.createElement('div');
                div.className = 'note-circle';
                div.style.backgroundColor = notesInfo[note].color;
                div.innerText = note;
                area.appendChild(div);
                
                // 播放音高
                playTone(notesInfo[note].freq);
                
            }, i * 350); // 將間隔拉長到 350ms，讓聲音聽得更清楚
            renderTimers.push(timer);
        });
    }

    function checkAnswer(choice) {
        if (state.isAnswered) return;
        
        const msg = document.getElementById('message');
        
        if (choice === state.currentAnswer) {
            // 答對邏輯
            state.isAnswered = true; // 鎖定作答
            state.score += (100 + (state.combo * 20));
            state.correctCount++;
            state.combo++;
            msg.innerText = "✔️ 正確！";
            msg.style.color = "#2ecc71";
            
            // 切換按鈕
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('next-btn-container').classList.remove('hidden');
            
        } else {
            // 答錯邏輯 (允許重試)
            state.combo = 0;
            msg.innerText = "❌ 答錯了，請再試一次！";
            msg.style.color = "#e74c3c";
            // 注意：這裡不設定 isAnswered = true，也不隱藏作答按鈕，讓玩家可以按另一個選項
        }
        
        document.getElementById('score').innerText = state.score;
        document.getElementById('combo').innerText = state.combo;
        document.getElementById('correct').innerText = state.correctCount;
    }

    function showGameOver() {
        document.getElementById('play-screen').classList.add('hidden');
        document.getElementById('game-over').classList.remove('hidden');
        document.getElementById('final-score').innerText = state.score;
    }

    function resetGame() {
        state = { level: 0, score: 0, combo: 0, correctCount: 0, currentAnswer: '', isAnswered: false };
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('game-over').classList.add('hidden');
    }
</script>

</body>
</html>
